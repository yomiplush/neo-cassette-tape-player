services:
  player:
    build:
      context: .
      args:
        PLAYER_EDITION: selfhost
    ports:
      - "${NEO_PORT:-8080}:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
